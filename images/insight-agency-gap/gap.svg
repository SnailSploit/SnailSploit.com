<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Expressed insight and observable action require separate verification</title><desc id="desc">Conceptual illustration based on the manuscript; no quantitative results are depicted.</desc><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#23252b" stroke-width=".6"/></pattern></defs><rect width="100%" height="100%" fill="#101114"/><rect width="100%" height="100%" fill="url(#grid)"/><g font-family="Arial, sans-serif"><text x="64" y="64" fill="#5eb8a8" font-size="16">SNAILSPLOIT / RESEARCH SESSION 001</text><text x="64" y="142" fill="#e9e7e1" font-size="54">The Insight–Agency Gap</text><text x="64" y="184" fill="#b6b4ac" font-size="24">Recognition is observable. Correction must be verified.</text><rect x="64" y="244" width="454" height="230" rx="6" fill="#17191d" stroke="#5eb8a8"/><text x="94" y="287" fill="#5eb8a8" font-size="16">01 / EXPRESSED INSIGHT</text><text x="94" y="342" fill="#e9e7e1" font-size="27">“I recognize the inconsistency.”</text><text x="94" y="392" fill="#b6b4ac" font-size="21">Model-generated explanation</text><text x="94" y="430" fill="#b6b4ac" font-size="18">An artifact to examine</text><rect x="682" y="244" width="454" height="230" rx="6" fill="#17191d" stroke="#e07a4a"/><text x="712" y="287" fill="#e07a4a" font-size="16">02 / OBSERVABLE BEHAVIOR</text><text x="712" y="342" fill="#e9e7e1" font-size="27">Does the decision change?</text><text x="712" y="392" fill="#b6b4ac" font-size="21">Response and tool-action record</text><text x="712" y="430" fill="#b6b4ac" font-size="18">An outcome to adjudicate</text><path d="M518 358 H565 M635 358 H682" stroke="#777a82" stroke-width="2"/><circle cx="600" cy="358" r="29" fill="#101114" stroke="#e07a4a"/><text x="588" y="368" fill="#e07a4a" font-size="30">≠</text><text x="64" y="542" fill="#5eb8a8" font-size="16">TEST BOTH DIRECTIONS</text><text x="64" y="580" fill="#e9e7e1" font-size="25">Correct verified errors · Resist persuasive but invalid corrections</text><text x="925" y="64" fill="#b6b4ac" font-size="16">KAI AIZEN · 2026</text></g></svg>