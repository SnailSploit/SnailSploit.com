<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc"><title id="title">Eight failure modes with their distinct evidence status</title><desc id="desc">Conceptual illustration based on the manuscript; no quantitative results are depicted.</desc><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#23252b" stroke-width=".6"/></pattern></defs><rect width="100%" height="100%" fill="#101114"/><rect width="100%" height="100%" fill="url(#grid)"/><g font-family="Arial, sans-serif"><text x="40" y="53" fill="#e9e7e1" font-size="24">EIGHT LABELS. DIFFERENT EVIDENCE STATUS.</text><text x="40" y="89" fill="#b6b4ac" font-size="19">A taxonomy for investigation; not eight equally validated mechanisms.</text><rect x="40" y="125" width="538" height="120" rx="6" fill="#17191d" stroke="#34363c"/><text x="62" y="154" fill="#5eb8a8" font-size="15">FM-001</text><text x="62" y="189" fill="#e9e7e1" font-size="23">Insight–Agency Gap</text><text x="62" y="221" fill="#b6b4ac" font-size="17">Preliminary behavioral observation</text><rect x="602" y="125" width="538" height="120" rx="6" fill="#17191d" stroke="#34363c"/><text x="624" y="154" fill="#5eb8a8" font-size="15">FM-002</text><text x="624" y="189" fill="#e9e7e1" font-size="23">Differential Override Pathways</text><text x="624" y="221" fill="#b6b4ac" font-size="17">Framing-sensitivity hypothesis</text><rect x="40" y="265" width="538" height="120" rx="6" fill="#17191d" stroke="#34363c"/><text x="62" y="294" fill="#5eb8a8" font-size="15">FM-003</text><text x="62" y="329" fill="#e9e7e1" font-size="23">Post-Hoc Justification</text><text x="62" y="361" fill="#b6b4ac" font-size="17">Causal hypothesis</text><rect x="602" y="265" width="538" height="120" rx="6" fill="#17191d" stroke="#34363c"/><text x="624" y="294" fill="#5eb8a8" font-size="15">FM-004</text><text x="624" y="329" fill="#e9e7e1" font-size="23">Context Contamination</text><text x="624" y="361" fill="#b6b4ac" font-size="17">Preliminary methodological observation</text><rect x="40" y="405" width="538" height="120" rx="6" fill="#17191d" stroke="#34363c"/><text x="62" y="434" fill="#5eb8a8" font-size="15">FM-005</text><text x="62" y="469" fill="#e9e7e1" font-size="23">Fluent Confabulation</text><text x="62" y="501" fill="#b6b4ac" font-size="17">Concrete output error in reported record</text><rect x="602" y="405" width="538" height="120" rx="6" fill="#17191d" stroke="#34363c"/><text x="624" y="434" fill="#e07a4a" font-size="15">FM-006</text><text x="624" y="469" fill="#e9e7e1" font-size="23">Care–Compliance Tension</text><text x="624" y="501" fill="#b6b4ac" font-size="17">Preliminary agent-security hypothesis</text><rect x="40" y="545" width="538" height="120" rx="6" fill="#17191d" stroke="#34363c"/><text x="62" y="574" fill="#e07a4a" font-size="15">FM-007</text><text x="62" y="609" fill="#e9e7e1" font-size="23">Same Cloth Principle</text><text x="62" y="641" fill="#b6b4ac" font-size="17">Design-tradeoff hypothesis</text><rect x="602" y="545" width="538" height="120" rx="6" fill="#17191d" stroke="#34363c"/><text x="624" y="574" fill="#e07a4a" font-size="15">FM-008</text><text x="624" y="609" fill="#e9e7e1" font-size="23">Intent Asymmetry</text><text x="624" y="641" fill="#b6b4ac" font-size="17">Detection hypothesis</text><text x="40" y="719" fill="#5eb8a8" font-size="17">Phase 1: FM-001–005 / conversational sessions</text><text x="40" y="749" fill="#e07a4a" font-size="17">Phase 2: FM-006–008 / browser-agent testing and conceptual extensions</text></g></svg>