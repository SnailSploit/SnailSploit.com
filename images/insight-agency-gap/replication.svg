<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc"><title id="title">Five proposed experimental conditions and three independently scored outcomes</title><desc id="desc">Conceptual illustration based on the manuscript; no quantitative results are depicted.</desc><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#23252b" stroke-width=".6"/></pattern></defs><rect width="100%" height="100%" fill="#101114"/><rect width="100%" height="100%" fill="url(#grid)"/><g font-family="Arial, sans-serif"><text x="40" y="54" fill="#e9e7e1" font-size="25">REPLICATION / SEPARATE ACCESS FROM EFFECT</text><text x="40" y="90" fill="#b6b4ac" font-size="20">Proposed conditions, not completed experimental results.</text><rect x="40" y="126" width="505" height="74" rx="6" fill="#17191d" stroke="#34363c"/><text x="60" y="157" fill="#5eb8a8" font-size="19">01</text><text x="112" y="157" fill="#e9e7e1" font-size="23">Fresh session</text><text x="112" y="183" fill="#b6b4ac" font-size="17">No threat discussion</text><rect x="40" y="216" width="505" height="74" rx="6" fill="#17191d" stroke="#34363c"/><text x="60" y="247" fill="#5eb8a8" font-size="19">02</text><text x="112" y="247" fill="#e9e7e1" font-size="23">Fresh session</text><text x="112" y="273" fill="#b6b4ac" font-size="17">Explicit threat priming</text><rect x="40" y="306" width="505" height="74" rx="6" fill="#17191d" stroke="#34363c"/><text x="60" y="337" fill="#5eb8a8" font-size="19">03</text><text x="112" y="337" fill="#e9e7e1" font-size="23">Ordinary feedback</text><text x="112" y="363" fill="#b6b4ac" font-size="17">No returned traces</text><rect x="40" y="396" width="505" height="74" rx="6" fill="#17191d" stroke="#34363c"/><text x="60" y="427" fill="#5eb8a8" font-size="19">04</text><text x="112" y="427" fill="#e9e7e1" font-size="23">Returned traces</text><text x="112" y="453" fill="#b6b4ac" font-size="17">No interpretation</text><rect x="40" y="486" width="505" height="74" rx="6" fill="#17191d" stroke="#34363c"/><text x="60" y="517" fill="#5eb8a8" font-size="19">05</text><text x="112" y="517" fill="#e9e7e1" font-size="23">Traces + commentary</text><text x="112" y="543" fill="#b6b4ac" font-size="17">Combined intervention</text><path d="M575 163 H605 V523 H575 M605 343 H650" fill="none" stroke="#5eb8a8" stroke-width="2"/><rect x="650" y="207" width="510" height="275" rx="6" fill="#17191d" stroke="#e07a4a"/><text x="676" y="246" fill="#e07a4a" font-size="17">INDEPENDENT OUTCOME ASSESSMENT</text><text x="676" y="294" fill="#e9e7e1" font-size="28">Score separately</text><text x="676" y="338" fill="#e9e7e1" font-size="22">Conversational agreement</text><text x="676" y="376" fill="#e9e7e1" font-size="22">Factual correction</text><text x="676" y="414" fill="#e9e7e1" font-size="22">Executed action</text><text x="676" y="454" fill="#b6b4ac" font-size="17">Ground truth defined before testing</text><text x="40" y="623" fill="#b6b4ac" font-size="20">Record context length, task exposure, tool permissions, trial counts and uncertainty.</text></g></svg>